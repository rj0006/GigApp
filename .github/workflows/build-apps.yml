name: Build and publish Android apps

on:
  push:
    branches: [main]
    paths:
      - customer_app/**
      - provider_app/**
      - .github/workflows/build-apps.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apps
  cancel-in-progress: false

env:
  API_BASE_URL: https://gigapp.factualtechnologies.tech
  FLUTTER_VERSION: 3.44.6

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          - { dir: customer_app, file: gigapp-customer.apk }
          - { dir: provider_app, file: gigapp-partner.apk }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore the signing key
        working-directory: ${{ matrix.app.dir }}/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "The ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.keystore"
          } > key.properties

      - name: Build
        working-directory: ${{ matrix.app.dir }}
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=API_BASE_URL=${API_BASE_URL} \
            --build-number=${{ github.run_number }}
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/${{ matrix.app.file }}

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app.dir }}
          path: dist/${{ matrix.app.file }}
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload to the website
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT:-22}"
          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${DEPLOY_PATH}/wwwroot/downloads"
          rsync -az -e "$SSH" apks/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/wwwroot/downloads/"
